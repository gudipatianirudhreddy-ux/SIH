[project]
name = "sih"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gudipatianirudhreddy-ux", email = "gudipati.anirudh.reddy@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "supabase>=2.31.0",
]

[project.scripts]
sih = "sih:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
